<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Voice & Chat Studio | ElevenLabs Style</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --card-bg: rgba(20, 20, 25, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #ededed;
      --text-muted: #88888e;
      --accent-gradient: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* Studio Header */
    header {
      padding: 24px 40px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(10, 10, 12, 0.8);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: -0.02em;
    }

    .brand-badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 100px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #a1a1aa;
    }

    /* Main Grid Layout */
    .studio-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      padding: 40px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }

    /* Control Panel (Left Side) */
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 32px;
      backdrop-filter: blur(16px);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .panel-header {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .panel-header h2 {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .panel-header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    /* 2 Main Action Buttons */
    .action-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
      background: rgba(255, 255, 255, 0.03);
      color: var(--text-main);
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.07);
      transform: translateY(-2px);
    }

    .action-btn.active {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
    }

    .action-btn svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    /* Code Snippet Box */
    .code-box-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .code-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .code-header label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .copy-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .copy-btn:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.3);
    }

    pre {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      overflow-x: auto;
      font-family: monospace;
      font-size: 0.85rem;
      color: #a1a1aa;
      line-height: 1.5;
      flex: 1;
    }

    /* Interactive Sandbox Preview (Right Side) */
    .preview-stage {
      background: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.05) 0%, transparent 70%);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      overflow: hidden;
    }

    .preview-label {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    /* Voicebot Widget UI */
    .voice-widget {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      text-align: center;
      width: 100%;
      max-width: 320px;
    }

    .wave-sphere {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 50px rgba(168, 85, 247, 0.3);
      animation: pulseSphere 3s infinite ease-in-out;
    }

    @keyframes pulseSphere {
      0%, 100% { transform: scale(1); filter: blur(0px); }
      50% { transform: scale(1.05); filter: blur(1px); }
    }

    .audio-bars {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .bar {
      width: 4px;
      height: 24px;
      background: #ffffff;
      border-radius: 4px;
      animation: bounce 1.2s infinite ease-in-out alternate;
    }
    .bar:nth-child(2) { animation-delay: 0.2s; }
    .bar:nth-child(3) { animation-delay: 0.4s; }
    .bar:nth-child(4) { animation-delay: 0.1s; }

    @keyframes bounce {
      0% { height: 10px; }
      100% { height: 40px; }
    }

    /* Chatbot Widget UI */
    .chat-widget {
      width: 100%;
      max-width: 380px;
      height: 480px;
      background: rgba(18, 18, 22, 0.95);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .chat-head {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.02);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    .chat-body {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .msg.bot {
      background: rgba(255, 255, 255, 0.08);
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .msg.user {
      background: #ffffff;
      color: #000000;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .chat-foot {
      padding: 12px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 8px;
    }

    .chat-foot input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      outline: none;
    }

    .send-btn {
      background: #ffffff;
      color: #000;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Hide element helper */
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>ElevenLabs Studio</span>
      <span class="brand-badge">Auto-Generator</span>
    </div>
  </header>

  <main class="studio-grid">
    <!-- Left Control Panel -->
    <section class="panel">
      <div class="panel-header">
        <h2>Select Assistant Type</h2>
        <p>Generate production-ready embed codes for web apps with one click.</p>
      </div>

      <!-- Main 2 Action Buttons -->
      <div class="action-bar">
        <button class="action-btn active" id="btnVoice" onclick="activateWidget('voice')">
          <svg viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>
          Voicebot
        </button>
        <button class="action-btn" id="btnChat" onclick="activateWidget('chat')">
          <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Chatbot
        </button>
      </div>

      <!-- Generated Code Output -->
      <div class="code-box-container">
        <div class="code-header">
          <label>Generated Embedded Code</label>
          <button class="copy-btn" onclick="copyEmbedCode()">Copy Code</button>
        </div>
        <pre><code id="codeSnippet"></code></pre>
      </div>
    </section>

    <!-- Right Live Preview Sandbox -->
    <section class="preview-stage">
      <div class="preview-label">Live Test Environment</div>

      <!-- Voicebot Preview Stage -->
      <div class="voice-widget" id="voiceStage">
        <div class="wave-sphere">
          <div class="audio-bars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
        </div>
        <div>
          <h3 style="font-size: 1.1rem; margin-bottom: 4px;">Conversational AI Agent</h3>
          <p style="color: var(--text-muted); font-size: 0.85rem;">Listening for audio input...</p>
        </div>
      </div>

      <!-- Chatbot Preview Stage -->
      <div class="chat-widget hidden" id="chatStage">
        <div class="chat-head">
          <div class="status-dot"></div>
          <span style="font-weight: 600; font-size: 0.9rem;">ElevenLabs AI Assistant</span>
        </div>
        <div class="chat-body" id="chatMessages">
          <div class="msg bot">Hello! How can I assist you with your project today?</div>
        </div>
        <div class="chat-foot">
          <input type="text" id="chatInput" placeholder="Type a test message..." onkeydown="handleKey(event)">
          <button class="send-btn" onclick="sendTestMessage()">Send</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    // Templates for embedded code generation
    const embedTemplates = {
      voice: `<!-- ElevenLabs AI Voicebot Widget -->
<script src="https://elevenlabs.io/convai-widget/index.js" async><\/script>
<elevenlabs-convai agent-id="YOUR_VOICE_AGENT_ID"></elevenlabs-convai>`,

      chat: `<!-- ElevenLabs AI Chatbot Widget -->
<script src="https://elevenlabs.io/chat-widget/index.js" async><\/script>
<elevenlabs-chat agent-id="YOUR_CHAT_AGENT_ID"></elevenlabs-chat>`
    };

    let activeType = 'voice';

    // Switch between Voicebot and Chatbot modes
    function activateWidget(type) {
      activeType = type;

      // Update active state of buttons
      document.getElementById('btnVoice').classList.toggle('active', type === 'voice');
      document.getElementById('btnChat').classList.toggle('active', type === 'chat');

      // Update visible preview
      document.getElementById('voiceStage').classList.toggle('hidden', type !== 'voice');
      document.getElementById('chatStage').classList.toggle('hidden', type !== 'chat');

      // Update generated embed code snippet
      document.getElementById('codeSnippet').textContent = embedTemplates[type];
    }

    // Copy snippet functionality
    function copyEmbedCode() {
      const code = embedTemplates[activeType];
      navigator.clipboard.writeText(code);
      const copyBtn = document.querySelector('.copy-btn');
      copyBtn.textContent = 'Copied!';
      setTimeout(() => copyBtn.textContent = 'Copy Code', 2000);
    }

    // Auto-generate chat testing functionality
    function sendTestMessage() {
      const input = document.getElementById('chatInput');
      const container = document.getElementById('chatMessages');
      const text = input.value.trim();

      if (!text) return;

      // Add user message
      const userMsg = document.createElement('div');
      userMsg.className = 'msg user';
      userMsg.textContent = text;
      container.appendChild(userMsg);

      input.value = '';
      container.scrollTop = container.scrollHeight;

      // Simulated automated agent response
      setTimeout(() => {
        const botMsg = document.createElement('div');
        botMsg.className = 'msg bot';
        botMsg.textContent = "I'm receiving your input. This is an auto-generated preview of your assistant in action!";
        container.appendChild(botMsg);
        container.scrollTop = container.scrollHeight;
      }, 600);
    }

    function handleKey(e) {
      if (e.key === 'Enter') sendTestMessage();
    }

    // Initialize default state on load
    window.onload = () => {
      activateWidget('voice');
    };
  </script>
</body>
</html>
